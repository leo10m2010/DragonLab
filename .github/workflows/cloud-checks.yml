name: Cloud checks
on:
  push:
    paths: ['cloud/**','cloud_*.py','launcher.py','.github/workflows/cloud-checks.yml']
  pull_request:
    paths: ['cloud/**','cloud_*.py','launcher.py','app.py','.github/workflows/cloud-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: cloud
      - run: npm run test:db
        working-directory: cloud
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: cloud/frontend
      - run: npm run build
        working-directory: cloud/frontend
      - run: python -m unittest discover -s cloud/tests -p 'test_*.py'
      - run: python -m compileall -q cloud_client.py cloud_runtime.py cloud_profiles.py launcher.py cloud/jobs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check cloud/supabase/functions/admin-create-user/index.ts
      - run: deno check cloud/supabase/functions/dragonlab-api/index.ts
      - run: deno test cloud/tests/api_test.ts
