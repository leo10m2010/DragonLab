name: Companion input checks
on:
  push:
    paths: ['app.py','auto_fire.py','firing.py','shortcuts.py','strength_guide.py','trajectories.py','tests/**','.github/workflows/companion-checks.yml']
  pull_request:
    paths: ['app.py','auto_fire.py','firing.py','shortcuts.py','strength_guide.py','trajectories.py','tests/**','.github/workflows/companion-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==12.3.0
      - run: python -B -m unittest discover -s tests -p test_companion_input.py -v
