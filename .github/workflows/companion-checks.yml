name: Companion input checks
on:
  push:
    paths: ['*.py','tests/**','.github/workflows/companion-checks.yml']
  pull_request:
    paths: ['*.py','tests/**','.github/workflows/companion-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==12.3.0
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - run: xvfb-run -a python -B -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tests --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - run: xvfb-run -a npm run test:browser --prefix tests
