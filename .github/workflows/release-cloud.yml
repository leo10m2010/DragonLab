name: Publish Cloud release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version: e.g. 0.13.0'
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller==6.22.3 pillow==12.3.0
      - name: Prepare tested Rust toolchain
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          "RUSTUP_TOOLCHAIN=1.94.1" >> $env:GITHUB_ENV
      - name: Stamp visible versions
        env:
          CLOUD_VERSION: ${{ inputs.version }}
        run: python cloud/stamp_version.py
      - name: Build launcher
        run: |
          ./native/build_native.ps1
          python -m PyInstaller --noconfirm --distpath cloud-dist --workpath cloud-build/launcher native/DragonLab-Launcher.spec
      - name: Build licensed client
        run: |
          python -m PyInstaller --noconfirm --distpath cloud-dist --workpath cloud-build/client native/DragonLab-Cloud.spec
      - name: Verify native components in the package
        run: |
          $process=Start-Process -FilePath (Resolve-Path cloud-dist/DragonLab-Launcher.exe).Path -ArgumentList '--native-check',"$pwd/native-check.json" -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          Get-Content native-check.json
      - name: Manifest and launcher package
        env:
          CLOUD_VERSION: ${{ inputs.version }}
          CLOUD_REPOSITORY: ${{ github.repository }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLIC_KEY: ${{ vars.SUPABASE_PUBLIC_KEY }}
          PANEL_URL: ${{ vars.PANEL_URL }}
        run: python cloud/release_manifest.py
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUD_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: gh release create "cloud-v$env:CLOUD_VERSION" cloud-dist/DragonLab-Cloud.exe cloud-dist/dragonlab-release.json cloud-dist/DragonLab-Launcher.zip --title "DragonLab Cloud $env:CLOUD_VERSION" --notes "Login, acceso por meses, actualizaciones y mediciones compartidas con consentimiento."
